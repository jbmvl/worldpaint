<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc de palette</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="/node_modules/suncalc/suncalc.js"></script>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/examples/jsm/objects/Sky.js": "/node_modules/three/examples/jsm/objects/Sky.js",
  "suncalc": "/demo/lab/suncalc-global.js",
  "pbf": "/node_modules/pbf/index.js",
  "@mapbox/vector-tile": "/node_modules/@mapbox/vector-tile/index.js",
  "@mapbox/point-geometry": "/node_modules/@mapbox/point-geometry/index.js"
} }
</script>
</head>
<body>
<script type="module">
/*
 * Banc de palette : un lieu enregistré, rendu comme la démo (ACES, exposition),
 * avec un thème retouché par `?opt=<JSON>` :
 *   exposure, saturation, weather (« grand beau » par défaut), walls, air: {fog, sun, ambient, haze, turbidity, water} (l'air du pays
 *   de la matrice locale), soil: {grass, bare, farmland}, asphalt: '#hex'.
 * `palLab.set({ lng, lat, y, yawDeg, pitchDeg, hour, fov })` : `y` absolu, comme
 * l'« alt » de l'afficheur de la démo.
 */
import * as THREE from 'three';
import { Sky } from 'three/examples/jsm/objects/Sky.js';
import { createWorld, defaultTheme, applyToneMapping, TONE_MAPPING } from '/src/index.js';

const params = new URLSearchParams(location.search);
const name = params.get('lieu') || 'montreuil-bellay';
const opt = JSON.parse(params.get('opt') || '{}');
const matrix = params.get('matrice') || 'terraced_slope';
const base = `/demo/lab/places/${name}`;
const place = await (await fetch(`${base}/place.json`)).json();

const theme = {};
if (opt.air) {
  const variants = defaultTheme.sky.variants.map((v) => ({ ...v, matrix: v.matrix.filter((m) => m !== matrix) }));
  theme.sky = { ...defaultTheme.sky, variants: [{ name: 'essai', matrix: [matrix], ...opt.air }, ...variants] };
}
if (opt.soil) theme.soils = { ...defaultTheme.soils, [matrix]: { ...defaultTheme.soils[matrix], ...opt.soil } };
if (opt.asphalt) {
  const surfaces = { ...defaultTheme.roads.surfaces, asphalt: { ...defaultTheme.roads.surfaces.asphalt, base: opt.asphalt } };
  theme.roads = { ...defaultTheme.roads, surfaces };
}
if (opt.walls) {
  // Murs assombris d'un facteur linéaire, toutes palettes.
  const scale = (hex) => '#' + [1, 3, 5].map((i) => {
    const c = parseInt(hex.slice(i, i + 2), 16) / 255;
    const lin = (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4) * opt.walls;
    const out = lin <= 0.0031308 ? lin * 12.92 : 1.055 * lin ** (1 / 2.4) - 0.055;
    return Math.round(Math.min(1, out) * 255).toString(16).padStart(2, '0');
  }).join('');
  theme.towns = Object.fromEntries(Object.entries(defaultTheme.towns).map(([k, v]) => [k, v?.wall ? { ...v, wall: scale(v.wall) } : v]));
}
const tone = { exposure: opt.exposure ?? TONE_MAPPING.exposure, saturation: opt.saturation ?? TONE_MAPPING.saturation };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
applyToneMapping(THREE, renderer, tone);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
// `grade` : un étalonnage d'aperçu (filtre CSS), pour juger ce que donnerait une passe de sortie.
if (opt.grade) renderer.domElement.style.filter = `saturate(${opt.grade.saturate ?? 1}) contrast(${opt.grade.contrast ?? 1}) brightness(${opt.grade.brightness ?? 1})`;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.5, 20000);

const world = createWorld({
  THREE,
  scene,
  elevation: { zoom: place.elevation.zoom ?? place.zoom, url: `${base}/dem/{z}/{x}/{y}.${place.elevation.extension}`, encoding: place.elevation.encoding },
  vector: place.vector ? { tiles: [`${location.origin}${base}/vector/{z}/{x}/{y}.pbf`], maxZoom: place.vector.maxZoom } : null,
  sky: { Sky, toneMappingExposure: tone.exposure, toneMappingSaturation: tone.saturation, weather: opt.weather ?? { cloudCover: 0.06, cloudDensity: 0.35, precipitation: 0, wind: 0.12, haze: 0 } },
  theme: Object.keys(theme).length ? theme : null,
});

const state = { lng: place.lng, lat: place.lat, y: 24, yawDeg: 91, pitchDeg: -2, hour: 14, fov: 65 };
let center = null;
async function settle(x, z) {
  for (let pass = 0; pass < 6; pass++) {
    await world.refresh(state.lng, state.lat, { force: pass === 0 });
    for (let frame = 0; frame < 400; frame++) world.advance(1 / 30, { x, y: state.y, z });
  }
  const far = world.composer.far;
  for (let wait = 0; far && wait < 200 && (far._pending || !far._signature); wait++) {
    far.sync();
    await new Promise((resolve) => setTimeout(resolve, 50));
  }
  for (let frame = 0; frame < 20; frame++) world.advance(1, { x, y: state.y, z });
}

function render() {
  const { x, z } = world.frame.toLocal(state.lng, state.lat);
  const yaw = (state.yawDeg * Math.PI) / 180;
  const pitch = (state.pitchDeg * Math.PI) / 180;
  if (Number.isFinite(state.height)) state.y = (world.composer.groundElevationAt(x, z) ?? 0) + state.height;
  camera.position.set(x, state.y, z);
  camera.lookAt(x + Math.sin(yaw) * Math.cos(pitch), state.y + Math.sin(pitch), z - Math.cos(yaw) * Math.cos(pitch));
  camera.fov = state.fov;
  const date = new Date(Date.UTC(2026, 6, 15, state.hour - Math.round(state.lng / 15), 0));
  const paint = world.updateSky({ camera, date, lng: state.lng, lat: state.lat, shadowAt: { x, y: state.y, z } });
  if (paint) renderer.setClearColor(paint.clearColor, 1);
  world.advance(0, { x, y: state.y, z });
  if (opt.light) {
    world.environment.sun.intensity *= opt.light.sun ?? 1;
    world.environment.ambient.intensity *= opt.light.ambient ?? 1;
  }
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  return { region: world.composer.landscape?.region?.id, matrix: world.composer.landscape?.region?.matrix };
}

window.palLab = {
  async set(options = {}) {
    Object.assign(state, options);
    const key = `${state.lng},${state.lat}`;
    if (key !== center) {
      center = key;
      await world.setCenter(state.lng, state.lat);
      const { x, z } = world.frame.toLocal(state.lng, state.lat);
      await settle(x, z);
    }
    return render();
  },
  world,
};
window.palLabReady = true;
</script>
</body>
</html>
