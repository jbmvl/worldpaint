<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc du ciel</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="/node_modules/suncalc/suncalc.js"></script>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/examples/jsm/objects/Sky.js": "/node_modules/three/examples/jsm/objects/Sky.js",
  "suncalc": "/demo/lab/suncalc-global.js"
} }
</script>
</head>
<body>
<script type="module">
/*
 * Banc du ciel — le ciel, le soleil et le brouillard seuls, sur un sol plat
 * semé de blocs jusqu'au bord du brouillard. Aucune tuile, aucun réseau :
 * piloté depuis la console ou par `scripts/sky-shot.mjs`.
 *
 *   skyLab.set({ sunDeg: 8, lookDeg: 180, pitchDeg: 5, weather: { haze: 0.3 } })
 *   skyLab.set({ pixelRatio: 2 })  — un écran Retina, quel que soit le vôtre
 *
 * `lookDeg` est l'écart de cap avec le soleil (0 = face à lui).
 *
 *   skyLab.set({ birds: 'gull', time: 20, pitchDeg: 25 })  — le vol de `LifeLayer`
 *
 * `birds` impose l'espèce (`corvid`, `raptor`, `gull`), `time` fige les vols
 * et les passages nocturnes à la seconde choisie.
 *
 *   skyLab.set({ night: 'bats', sunDeg: -10, time: 30, pitchDeg: 20 })
 *   skyLab.set({ night: 'fireflies', sunDeg: -12, height: 1.7, time: 3 })
 *   skyLab.set({ starlings: 4, pitchDeg: 15, height: 1.7 })
 *
 * `night` montre une bête de nuit (le sol plat y est tout entier un bois),
 * `starlings` le vol levé d'un dortoir à 40 m, `starlings` secondes après l'envol.
 *
 *   skyLab.set({ swallows: 'perched', height: 1.7, pitchDeg: 25 })
 *   skyLab.set({ swallows: 1.5, height: 1.7, pitchDeg: 25 })
 *
 * `swallows` montre les hirondelles d'une ligne aérienne tendue à 15 m
 * (portée de 40 m) : posées, ou `swallows` secondes après l'envol ;
 * `aim: 'swallowsPerched'` ou `'swallowsFlying'` les vise.
 */
import * as THREE from 'three';
import { Sky } from 'three/examples/jsm/objects/Sky.js';
import { SceneEnvironment } from '/src/environment/sceneEnvironment.js';
import { LifeLayer, GULL_SEA_DISTANCE_M } from '/src/layers/lifeLayer.js';
import { launchFlock } from '/src/layers/starlings.js';
import { launchSwallows, perchesNear } from '/src/layers/swallows.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.5; // comme la démo
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 20000);
const FOG_RADIUS = 2200;
const env = new SceneEnvironment({ THREE, Sky, scene, fogRadius: FOG_RADIUS });

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40000, 40000).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x5f8a45, roughness: 1 })
);
ground.receiveShadow = true;
scene.add(ground);
const block = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
const wall = new THREE.MeshStandardMaterial({ color: 0xd8d2c4, roughness: 0.9 });
for (let i = 0; i < 400; i++) {
  // Semis déterministe : même banc, mêmes blocs.
  const a = (i * 2.399963) % (Math.PI * 2);
  const r = 60 + Math.sqrt(i / 400) * 3000;
  const m = new THREE.Mesh(block, wall);
  m.scale.set(12 + (i % 5) * 4, 6 + (i % 7) * 3, 10 + (i % 3) * 5);
  m.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  m.castShadow = true;
  scene.add(m);
}

const LAT = 45;
const LNG = 0;
const SunCalc = window.SunCalc;

/** Date du matin du solstice d'été où le soleil est à `deg` au-dessus de l'horizon (négatif : avant l'aube). */
function dateForElevation(deg) {
  const day = Date.UTC(2026, 5, 21);
  let lo = day - 4 * 3600e3; // nuit
  let hi = day + 12 * 3600e3; // midi solaire à lng 0
  const target = (deg * Math.PI) / 180;
  for (let k = 0; k < 50; k++) {
    const mid = (lo + hi) / 2;
    if (SunCalc.getPosition(new Date(mid), LAT, LNG).altitude < target) lo = mid;
    else hi = mid;
  }
  return new Date(hi);
}

const state = { sunDeg: 30, lookDeg: 90, pitchDeg: 4, height: 40, weather: null, birds: null, time: 0, night: null, starlings: null, swallows: null, aim: null };
const life = new LifeLayer({ THREE, scene, bubble: null });
for (const mesh of life._balloonMeshes) mesh.visible = false;
life._balloonsVisible = false;
const labGround = {
  frame: { zoom: 14, scale: 2445, origin: { x: 8000, y: 5800 } },
  woodAt: () => 1,
  elevationAt: () => 0,
  wires: [],
};
// La ligne des hirondelles : la portée telle que la publie le mobilier, et son câble.
const wireSpan = { ax: -20, ay: 8.35, az: -15, bx: 20, by: 8.35, bz: -15, sag: 1.12 };
// Glissée le long d'elle-même jusqu'à une portée habitée : une sur vingt-huit environ l'est.
for (let dx = 0; !perchesNear(labGround.frame, { x: dx, z: 0 }, [wireSpan]).length; dx += 0.5) {
  wireSpan.ax = -20 + dx;
  wireSpan.bx = 20 + dx;
}
const wireShift = wireSpan.ax + 20;
const wireLine = new THREE.Group();
wireLine.position.x = wireShift;
{
  const points = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    points.push(new THREE.Vector3(-20 + 40 * t, 8.35 - wireSpan.sag * 4 * t * (1 - t), -15));
  }
  wireLine.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: '#222' })));
  for (const x of [-20, 20]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 8.6, 6), new THREE.MeshLambertMaterial({ color: '#5b4632' }));
    pole.position.set(x, 4.3, -15);
    wireLine.add(pole);
  }
  wireLine.visible = false;
  scene.add(wireLine);
}

function render() {
  const date = dateForElevation(state.sunDeg);
  env.update({ date, lat: LAT, lng: LNG, weather: state.weather });
  const sun = env._sunDir;
  const sunYaw = Math.atan2(sun.x, -sun.z);
  const yaw = sunYaw + (state.lookDeg * Math.PI) / 180;
  const pitch = (state.pitchDeg * Math.PI) / 180;
  camera.position.set(0, state.height, 0);
  camera.lookAt(Math.sin(yaw) * Math.cos(pitch), state.height + Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  env.followCamera(camera);
  env._trafficTime = state.time;
  env.advance(0, camera.position);
  env.followShadow({ x: 0, y: 0, z: 0 });
  life.birds.visible = !!state.birds;
  if (state.birds) {
    life.setRelief(state.birds === 'raptor' ? { elevation: 2000, slope: 0 } : null);
    life.setSeaDistance(state.birds === 'gull' ? 0 : GULL_SEA_DISTANCE_M * 2);
    life.time = state.time;
    life.advance(0, camera.position);
  }
  life.setNight(state.night ? 1 : 0);
  life.birds.visible = !!state.birds;
  life.bats.visible = state.night === 'bats';
  life.fireflies.visible = state.night === 'fireflies';
  life.starlings.visible = state.starlings !== null;
  life.bats.count = life.fireflies.count = life.starlings.count = 0;
  wireLine.visible = state.swallows !== null;
  life.swallowsPerched.visible = life.swallowsFlying.visible = state.swallows !== null;
  life.swallowsPerched.count = life.swallowsFlying.count = 0;
  if (state.swallows !== null) {
    life.time = state.time;
    labGround.wires = [wireSpan];
    life._perchedAt = null;
    life._flushed.clear();
    const at = { x: camera.position.x, y: 0, z: camera.position.z };
    if (state.swallows === 'perched') {
      // Vu de loin pour le moteur, qui sinon les lèverait : la caméra est à 15 m.
      life._advanceSwallows({ ...at, z: at.z + 100 }, labGround);
    } else {
      for (const perch of perchesNear(labGround.frame, at, labGround.wires)) {
        life._flushed.set(perch.key, launchSwallows(perch, at, state.time - state.swallows, life._wallClock));
      }
      life._advanceSwallows(at, labGround);
    }
  }
  if (state.night || state.starlings !== null) {
    life.time = state.time;
    life._starlingFlock = state.starlings === null ? null : {
      ...launchFlock({ x: 0, z: -40, seed: 0.5 }, 0, { x: 0, z: 0 }, state.time - state.starlings),
      frame: labGround.frame,
    };
    life._roostCheck = Infinity;
    const at = { x: camera.position.x, y: 0, z: camera.position.z };
    life._advanceBats(at);
    life._advanceFireflies(at, labGround);
    life._advanceStarlings(0, at, labGround);
  }
  if (state.aim) {
    // Vise le centre de ce qui vole, pour le regarder de près.
    const mesh = life[state.aim];
    const c = new THREE.Vector3(), p = new THREE.Vector3(), m = new THREE.Matrix4();
    for (let i = 0; i < mesh.count; i++) { mesh.getMatrixAt(i, m); c.add(p.setFromMatrixPosition(m)); }
    if (mesh.count) camera.lookAt(c.divideScalar(mesh.count));
  }
  renderer.setClearColor(env.clearColor, 1);
  renderer.render(scene, camera);
  return {
    sunDeg: state.sunDeg,
    fog: '#' + env.fog.color.getHexString(THREE.SRGBColorSpace),
    nightMix: env.nightMix,
    life: { bats: life.bats.count, fireflies: life.fireflies.count, starlings: life.starlings.count,
      swallowsPerched: life.swallowsPerched.count, swallowsFlying: life.swallowsFlying.count },
  };
}

window.skyLab = {
  set(options = {}) {
    Object.assign(state, options);
    if ('weather' in options) state.weather = options.weather;
    if ('pixelRatio' in options) {
      renderer.setPixelRatio(options.pixelRatio);
      renderer.setSize(innerWidth, innerHeight);
    }
    return render();
  },
  state,
  env,
};
window.skyLabReady = true;
render();
</script>
</body>
</html>
