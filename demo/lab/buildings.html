<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc des bâtiments de Montreuil-Bellay</title>
<style>html,body{margin:0;background:#9cb8d0}canvas{display:block}#nom{position:absolute;top:16px;left:20px;font:18px sans-serif;color:#24313e;background:#ffffffdd;padding:10px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head>
<body><div id="nom"></div>
<script type="module">
/*
 * Empreintes et lieux OSM extraits des tuiles enregistrées de Montreuil-Bellay.
 * Sol plat, bâti seul, aucun réseau extérieur : le château, l’église et le
 * Super U et l’enceinte se regardent avec leurs contours réels.
 * buildingsLab.set({ subject: 0, yawDeg: 45, pitchDeg: -25, distance: 120 })
 */
import * as THREE from 'three';
import { createLocalFrame } from '/src/core/tileMath.js';
import { BuildingLayer } from '/src/layers/buildingLayer.js';
import { RoadIndex } from '/src/layers/roadGraph.js';
const cases = await (await fetch('/test/fixtures/building-personalities-montreuil.json')).json();
cases.push(await (await fetch('/test/fixtures/building-walls-montreuil.json')).json());
const renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cb8d0);
scene.add(new THREE.HemisphereLight(0xdde8f0,0x6a6458,1.6));
const sun = new THREE.DirectionalLight(0xfff4e0,1.8);
sun.position.set(-40,80,30);scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000,2000).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x8a8a80}));
floor.position.y=-0.02;scene.add(floor);
const camera = new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.5,2000);
const state = {subject:0,yawDeg:45,pitchDeg:-25,distance:120,front:false,targetX:null,targetZ:null};
let layer;
function rebuild() {
  layer?.dispose();
  const item = cases[state.subject];
  const frame = createLocalFrame(...(item.poi?.geometry.coordinates || item.centre),14);
  const bubble = {frame,verticalScale:1,surfaceElevationAtLocal:()=>0};
  const source = {forEachFeature(name,tiles,visit) {
    for(const feature of name==='building'?item.buildings:name==='poi'&&item.poi?[item.poi]:[]) visit(feature.geometry,feature.properties);
  }};
  layer = new BuildingLayer({THREE,scene,bubble});
  // Une rue distante simule le parking de la grande surface.
  const roadIndex = new RoadIndex([{halfWidth:3.5,path:[{x:150,y:0,z:-200},{x:150,y:0,z:200}]}]);
  layer.rebuild(source,[],{x:0,z:0},{roadIndex});
  document.getElementById('nom').textContent=item.name;
}
function render() {
  const yaw=state.yawDeg*Math.PI/180,pitch=state.pitchDeg*Math.PI/180,d=state.distance;
  const box = new THREE.Box3().setFromObject(layer.mesh);
  const target = box.getCenter(new THREE.Vector3());
  if(state.targetX!==null) target.x=state.targetX;
  if(state.targetZ!==null) target.z=state.targetZ;
  if(state.front && layer.shopfronts.length) {
    const {a,b,y}=layer.shopfronts[0];target.set((a.x+b.x)/2,y+3,(a.z+b.z)/2);
  }
  camera.position.set(target.x-Math.sin(yaw)*Math.cos(pitch)*d,target.y-Math.sin(pitch)*d,target.z+Math.cos(yaw)*Math.cos(pitch)*d);
  camera.lookAt(target);renderer.render(scene,camera);
  return {name:cases[state.subject].name,built:layer.count,panes:layer.paneCount,shopfronts:layer.shopfronts.length};
}
window.buildingsLab = {state,get layer(){return layer;},set(options={}) {
  const changed=options.subject!==undefined&&options.subject!==state.subject;
  Object.assign(state,options);if(changed)rebuild();return render();
}};
rebuild();render();window.buildingsLabReady=true;
</script></body></html>
