<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc du montage</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="/node_modules/suncalc/suncalc.js"></script>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/examples/jsm/objects/Sky.js": "/node_modules/three/examples/jsm/objects/Sky.js",
  "suncalc": "/demo/lab/suncalc-global.js",
  "pbf": "/node_modules/pbf/index.js",
  "@mapbox/vector-tile": "/node_modules/@mapbox/vector-tile/index.js",
  "@mapbox/point-geometry": "/node_modules/@mapbox/point-geometry/index.js"
} }
</script>
</head>
<body>
<script type="module">
/*
 * Banc du montage — chronomètre une scène figée (`createWorld({ reach })` +
 * `mountAt`) sur un lieu enregistré, de la création du monde à la première
 * image complète. Les tuiles viennent du disque : le temps réseau n'y est pas.
 *
 *   await mountLab.run({ reach: 120, lieu: 'station-montreuil-bellay' })
 *   await mountLab.run({ reach: null })   // la bulle complète, pour comparer
 *   await mountLab.run({ reach: null, detail: { budget: Infinity } })   // sans resserrement en ville
 *   await mountLab.move({ dx: 400, steps: 8 })     // la portée suit l'observateur
 *   await mountLab.move({ reach: null })           // le monde s'ouvre sans se remonter
 *
 * Rend les temps par phase (création, `mountAt`, files vidées image par image,
 * premier rendu), les couches les plus lentes, ce qui a été bâti, et le rayon
 * et le pas de relève que la densité du lieu laisse au détail.
 */
import * as THREE from 'three';
import { Sky } from 'three/examples/jsm/objects/Sky.js';
import { createWorld } from '/src/index.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 20000);

let current = null;

/** Maillages visibles et triangles de la scène, et leur répartition par nom de maillage. */
function census(scene) {
  let meshes = 0, triangles = 0;
  const byName = {};
  scene.traverse((o) => {
    if (!o.isMesh || !o.visible) return;
    meshes++;
    const g = o.geometry;
    const n = g.index ? g.index.count : g.attributes.position?.count ?? 0;
    const count = Math.round((n / 3) * (o.isInstancedMesh ? o.count : 1));
    triangles += count;
    const name = o.name || o.parent?.name || '(sans nom)';
    const entry = (byName[name] ??= { meshes: 0, triangles: 0 });
    entry.meshes++;
    entry.triangles += count;
  });
  return { meshes, triangles, byName };
}

async function run({ detail = null, view = null, reach = 120, lieu = 'station-montreuil-bellay', lng = null, lat = null, yawDeg = 225, pitchDeg = 12, distance = 40, budgetMs } = {}) {
  current?.world.dispose();
  current = null;
  const base = `/demo/lab/places/${lieu}`;
  const place = await (await fetch(`${base}/place.json`)).json();
  const at = { lng: lng ?? place.lng, lat: lat ?? place.lat };

  const scene = new THREE.Scene();
  const t0 = performance.now();
  const world = createWorld({
    THREE,
    scene,
    elevation: { zoom: place.zoom, url: `${base}/dem/{z}/{x}/{y}.${place.elevation.extension}`, encoding: place.elevation.encoding },
    vector: place.vector ? { tiles: [`${location.origin}${base}/vector/{z}/{x}/{y}.pbf`], maxZoom: place.vector.maxZoom } : null,
    sky: { Sky },
    ...(reach ? { reach } : {}),
    ...(detail ? { detail } : {}),
    ...(view ? { view } : {}),
  });
  world.setProfiling(true);
  const t1 = performance.now();
  await world.mountAt(at.lng, at.lat, { budgetMs });
  const t2 = performance.now();

  // Les files (semis des arbres, mailles de terrain) se vident image par image.
  const c = world.composer;
  const busy = () => c.vegetation.pending || c.bubble._rebuildQueue.length > 0 || c.bubble._pendingBuild;
  let frames = 0;
  while (busy() && frames < 2000) {
    world.advance(1 / 60, { x: 0, y: 0, z: 0 });
    frames++;
  }
  const t3 = performance.now();

  const x = 0, z = 0;
  const y = c.groundElevationAt(x, z) ?? 0;
  const yaw = (yawDeg * Math.PI) / 180, pitch = (pitchDeg * Math.PI) / 180;
  camera.position.set(x - Math.sin(yaw) * Math.cos(pitch) * distance, y + 1.7 + Math.sin(pitch) * distance, z + Math.cos(yaw) * Math.cos(pitch) * distance);
  camera.lookAt(x, y + 1.7, z);
  const date = new Date(Date.UTC(2026, 5, 21, 15 - Math.round(at.lng / 15), 0));
  const paint = world.updateSky({ camera, date, lng: at.lng, lat: at.lat, shadowAt: { x, y, z } });
  if (paint) renderer.setClearColor(paint.clearColor, 1);
  world.advance(0, { x, y, z });
  renderer.render(scene, camera);
  renderer.getContext().finish();
  const t4 = performance.now();
  renderer.render(scene, camera);
  renderer.getContext().finish();
  const t5 = performance.now();

  current = { world, scene };
  const layers = Object.entries(world.generationStats)
    .filter(([name]) => !name.endsWith('Etape'))
    .sort((a, b) => b[1].totalMs - a[1].totalMs)
    .slice(0, 10)
    .map(([name, v]) => `${name} ${Math.round(v.totalMs)}`);
  const { meshes, triangles, byName } = census(scene);
  return {
    lieu, reach,
    createMs: Math.round(t1 - t0),
    mountMs: Math.round(t2 - t1),
    queuesMs: Math.round(t3 - t2), frames,
    firstRenderMs: Math.round(t4 - t3),
    renderMs: Math.round(t5 - t4),
    totalMs: Math.round(t4 - t0),
    decorRadius: c.bubble.decorReachMeters, decorStep: c.bubble.decorStepMeters,
    terrainTiles: c.bubble.tiles.size,
    vectorTiles: c._lastWanted?.length ?? null,
    meshes, triangles: Math.round(triangles), byName,
    calls: renderer.info.render.calls,
    layers,
  };
}

/**
 * Déplace l'observateur du monde monté et, au besoin, change sa portée : la
 * portée suit, ou s'ouvre (`reach: null`) sans remonter le monde. Rend ce qui
 * est bâti au point d'arrivée, à comparer à un `run` fait directement là.
 */
async function move({ reach, dx = 0, dz = 0, steps = 1, yawDeg = 225, pitchDeg = 12, distance = 40 } = {}) {
  if (!current) throw new Error('mountLab.move : aucun monde monté');
  const { world, scene } = current;
  const c = world.composer;
  if (reach !== undefined) world.setReach(reach);
  const from = current.at ?? { x: 0, z: 0 };
  let lngLat = null;
  for (let i = 1; i <= steps; i++) {
    const x = from.x + (dx * i) / steps, z = from.z + (dz * i) / steps;
    lngLat = world.frame.toLngLat(x, z);
    await world.setCenter(lngLat.lng, lngLat.lat);
    await world.refresh(lngLat.lng, lngLat.lat);
    for (let f = 0; f < 2000 && (c.vegetation.pending || c.bubble._rebuildQueue.length > 0 || c.bubble._pendingBuild); f++) {
      world.advance(1 / 60, { x, y: 0, z });
    }
  }
  const x = from.x + dx, z = from.z + dz;
  current.at = { x, z };
  const y = c.groundElevationAt(x, z) ?? 0;
  const yaw = (yawDeg * Math.PI) / 180, pitch = (pitchDeg * Math.PI) / 180;
  camera.position.set(x - Math.sin(yaw) * Math.cos(pitch) * distance, y + 1.7 + Math.sin(pitch) * distance, z + Math.cos(yaw) * Math.cos(pitch) * distance);
  camera.lookAt(x, y + 1.7, z);
  world.advance(0, { x, y, z });
  renderer.render(scene, camera);
  renderer.getContext().finish();
  const { meshes, triangles, byName } = census(scene);
  return {
    reach: world.reach, at: lngLat,
    decorRadius: c.bubble.decorReachMeters, decorStep: c.bubble.decorStepMeters,
    terrainTiles: c.bubble.tiles.size,
    farShown: !!c.far?.shown,
    meshes, triangles: Math.round(triangles), byName,
    calls: renderer.info.render.calls,
  };
}

window.mountLab = { run, move, get world() { return current?.world; } };
window.mountLabReady = true;
</script>
</body>
</html>
